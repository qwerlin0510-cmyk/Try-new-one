<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Noto Sans TC";font-weight:900;src:url(fonts/NotoSansTC-Black.otf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:"Noto Sans TC";background:radial-gradient(circle at 50% 40%,#fff6e6,#ffe2b8)}
.abs{position:absolute}
h1{left:0;right:0;top:300px;text-align:center;font-size:96px;font-weight:900;color:#3b2a1e}
h1 b{color:#ff8a1f}
.it{top:560px;width:460px;text-align:center}
.it img{width:420px;height:520px;object-fit:contain;filter:drop-shadow(0 16px 24px rgba(0,0,0,.15))}
.it .t{display:inline-block;margin-top:10px;font-size:64px;font-weight:900;color:#fff;background:#ff8a1f;padding:6px 36px 12px;border-radius:999px}
#a{left:70px;transform:rotate(-5deg)} #b{right:70px;transform:rotate(5deg)}
.cap{left:0;right:0;top:1440px;text-align:center}
.cap p{display:inline-block;padding:10px 36px 16px;border-radius:26px;font-size:64px;font-weight:900;color:#fff;background:rgba(28,28,30,.88)}
.kw{color:#FFB23F;font-size:1.75em;vertical-align:-.08em}
.note{left:0;right:0;top:1250px;text-align:center;font-size:44px;font-weight:900;color:#8a5a36}
</style></head><body>
<h1 class="abs">突然<b>好想吃</b>…</h1>
<div id="a" class="abs it"><img src="boba.png"><br><span class="t">珍奶</span></div>
<div id="b" class="abs it"><img src="chicken.png"><br><span class="t">炸雞</span></div>
<div class="abs cap"><p>像是<span class="kw">珍奶</span>或者是<span class="kw">炸雞</span></p></div>
</body></html>
