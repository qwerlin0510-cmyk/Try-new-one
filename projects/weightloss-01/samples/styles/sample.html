<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>
@font-face{font-family:"Noto Sans TC";font-weight:700;src:url(fonts/NotoSansTC-Bold.otf)}
@font-face{font-family:"Noto Sans TC";font-weight:900;src:url(fonts/NotoSansTC-Black.otf)}
@font-face{font-family:"Noto Color Emoji";src:url(fonts/NotoColorEmoji.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:"Noto Sans TC","Noto Color Emoji",sans-serif}
#bg{position:absolute;inset:0;background:url(frame.jpg) center/cover}
.abs{position:absolute}
.lab{left:40px;top:40px;font-size:44px;font-weight:900;color:#fff;background:rgba(0,0,0,.6);padding:8px 22px;border-radius:14px}
.card{left:90px;width:900px;top:1010px;padding:30px 40px 34px;border-radius:36px}
.card h3{font-size:50px;font-weight:900;margin-bottom:18px}
.row{display:flex;align-items:center;gap:20px;font-size:48px;font-weight:900;margin-top:14px}
.ck{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:40px;flex:none}
.cap{left:0;right:0;top:1495px;display:flex;justify-content:center;transform:translateY(-50%)}
.cap p{padding:10px 36px 16px;border-radius:26px;font-size:64px;font-weight:900;line-height:1.2;white-space:nowrap;color:#fff}
.kw{color:#FFB23F;font-size:1.75em;vertical-align:-.08em}
.face{left:133px;top:232px;width:635px;height:722px;border:4px dashed rgba(255,60,60,.0)}
/* A 清新薄荷 */
.A .card{background:rgba(255,255,255,.93);color:#22302b;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.A .card h3{color:#1f9e78}
.A .ck{background:#2BB58A;color:#fff}
.A .cap p{background:rgba(22,44,38,.86)}
/* B 活力貼紙 */
.B .card{background:rgba(28,28,30,.9);color:#fff;border:6px solid #FFB23F;transform:rotate(-1.5deg);box-shadow:10px 12px 0 #FFB23F}
.B .card h3{color:#FFB23F}
.B .ck{background:#FFB23F;color:#1c1c1e}
.B .cap p{background:rgba(28,28,30,.88)}
/* C 奶茶手寫 */
.C .card{background:rgba(250,241,226,.94);color:#5a3e2b;border-radius:28px;border:3px solid #c9a27a}
.C .card h3{color:#8a5a36}
.C .ck{background:transparent;border:4px solid #c27b46;color:#c27b46}
.C .row span.t{background:linear-gradient(transparent 58%,rgba(255,178,63,.55) 58%)}
.C .cap p{background:rgba(70,48,32,.86)}
</style></head><body class="S">
<div id="bg" class="abs"></div>
<div class="abs lab">LABEL</div>
<div class="abs card"><h3>✨ 真正的「瘦的訊號」</h3>
<div class="row"><span class="ck">✓</span><span class="t">肚子微微發空</span></div>
<div class="row"><span class="ck">✓</span><span class="t">不影響精神</span></div></div>
<div class="abs cap"><p>但不影響<span class="kw">精神</span></p></div>
</body></html>
